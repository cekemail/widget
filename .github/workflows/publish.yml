name: Publish to npm

on:
  release:
    types: [published]

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      - name: Update npm
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test -- --run

      - name: Build
        run: npm run build

      - name: Check release tag matches package version
        run: node -e "const v=require('./package.json').version; if (process.env.TAG !== 'v'+v) { console.error('Tag '+process.env.TAG+' != v'+v); process.exit(1) }"
        env:
          TAG: ${{ github.event.release.tag_name }}

      - name: Publish to npm
        run: npm publish --access public
